name: Ingest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Gate on secrets
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL is not configured. Skipping ingest."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache local models
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ runner.os }}-bge-ea104dacec62-bart-71a9d2a7c389-llama-82ac69368916-qwen-22942cb7d7ba
      - name: Ingest
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          WEB_REVALIDATE_URL: ${{ secrets.WEB_REVALIDATE_URL }}
          ENRICH: ${{ vars.ENRICH }}
