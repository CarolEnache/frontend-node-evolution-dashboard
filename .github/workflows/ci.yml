# Lint, typecheck, unit, build, Playwright, and a startup check for each
# environment. Vercel and Neon steps only echo what they would do.
# Do not set a job-level `environment:` key: that creates GitHub Environments.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Detect e2e script
        id: e2e
        run: |
          if node -e 'const scripts = require("./package.json").scripts || {}; if (!scripts["test:e2e"]) process.exit(1)'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.e2e.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: steps.e2e.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.e2e.outputs.enabled == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Playwright
        if: steps.e2e.outputs.enabled == 'true'
        run: pnpm test:e2e
      - name: Skip Playwright
        if: steps.e2e.outputs.enabled != 'true'
        run: 'echo "Skipping e2e: pnpm test:e2e is not defined yet. This step runs once that script exists."'

  startup:
    name: Startup (${{ matrix.app_env }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app_env: [development, integration, staging, production]
    # Set APP_ENV and NODE_ENV on the startup steps only. Job-level
    # NODE_ENV=production would make pnpm install skip devDependencies.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Web startup
        env:
          APP_ENV: ${{ matrix.app_env }}
          NODE_ENV: ${{ matrix.app_env }}
        run: |
          output="$(pnpm exec tsx scripts/web-startup.ts)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "hello world"
          printf '%s\n' "$output" | grep -F "APP_ENV=${APP_ENV}"
          printf '%s\n' "$output" | grep -F "NODE_ENV=${NODE_ENV}"
      - name: Worker startup
        env:
          APP_ENV: ${{ matrix.app_env }}
          NODE_ENV: ${{ matrix.app_env }}
        run: |
          output="$(pnpm exec tsx apps/worker/src/index.ts --startup-only)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "hello world"
          printf '%s\n' "$output" | grep -F "APP_ENV=${APP_ENV}"
          printf '%s\n' "$output" | grep -F "NODE_ENV=${NODE_ENV}"
          if printf '%s\n' "$output" | grep -F "[ingest]"; then
            echo "Worker startup fetched sources. --startup-only must exit before ingest."
            exit 1
          fi
      - name: "STUB: Neon"
        env:
          APP_ENV: ${{ matrix.app_env }}
        run: |
          echo "STUB: Neon is not called from CI."
          case "$APP_ENV" in
            development)
              echo "STUB: development keeps SQLite at data/dev.sqlite. Neon branch 'development' is not created or queried."
              ;;
            *)
              echo "STUB: would point hosted Postgres at Neon branch '${APP_ENV}'."
              ;;
          esac
          echo "STUB: no neonctl, no Neon API, no credentials."
      - name: "STUB: Vercel"
        env:
          APP_ENV: ${{ matrix.app_env }}
        run: |
          echo "STUB: Vercel is not called from CI. No project is created and nothing is deployed."
          case "$APP_ENV" in
            development)
              echo "STUB: development stays on pnpm dev. No Vercel deployment."
              ;;
            integration|staging)
              echo "STUB: would deploy apps/web to a Vercel preview custom environment named '${APP_ENV}'."
              ;;
            production)
              echo "STUB: would deploy apps/web to Vercel production."
              ;;
          esac
          echo "STUB: no vercel CLI, no credentials, no deploy."
