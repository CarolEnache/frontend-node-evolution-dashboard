# Opt-in real-model check. Not part of pull-request CI.
# Run with: gh workflow run model-smoke.yml
name: Model smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Real model smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache local models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ runner.os }}-bge-ea104dacec62-bart-71a9d2a7c389-llama-82ac69368916-qwen-22942cb7d7ba
      - name: Embedding dimensions and tag fixtures
        run: pnpm exec vitest run packages/ai/test/model-smoke.test.ts
        env:
          RUN_MODEL_TESTS: "1"
